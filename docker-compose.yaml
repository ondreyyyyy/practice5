services:
  db:
    image: exchange_db
    volumes:
      - db_data:/app/data
    networks:
      - exchange_net

  crypt:
    image: exchange_crypt
    deploy:
      replicas: 4
    networks:
      - exchange_net
    depends_on:
      - db

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - exchange_net
    depends_on:
      - crypt

networks:
  exchange_net:
  
volumes:
  db_data: